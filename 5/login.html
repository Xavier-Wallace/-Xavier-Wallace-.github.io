<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create an account for the Divine Nine website.">
    <title>Login | Divine Nine</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <header>
        <h1>Divine Nine</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="resources.html">Resources</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <h2>Welcome to the Divine Nine</h2>
            <p>Log in or create an account to access the website's features.</p>

            <div id="authMessage" role="status" aria-live="polite"></div>

            <section id="authForms">

                <form id="registerForm">
                    <h3>Create an Account</h3>

                    <label for="registerEmail">Email Address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        autocomplete="email"
                        required
                    >

                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button type="submit" id="registerButton">
                        Create Account
                    </button>
                </form>

                <hr>

                <form id="loginForm">
                    <h3>Already Have an Account?</h3>

                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        autocomplete="email"
                        required
                    >

                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >

                    <button type="submit" id="loginButton">
                        Log In
                    </button>
                </form>

            </section>

            <section id="userSection" hidden>
                <h3>You are logged in!</h3>
                <p id="userEmail"></p>
                <button type="button" id="logoutButton">
                    Log Out
                </button>
            </section>

        </section>
    </main>

    <footer>
        <p>Xavier Wallace | CSci 3054 Web Programming</p>
    </footer>

</body>
</html>
